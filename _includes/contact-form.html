<!-- Formspree endpoint — https://formspree.io/f/mojgyqre -->
<form class="contact-form" action="https://formspree.io/f/mojgyqre" method="POST">
  <label>
    Your name
    <input type="text" name="_name">
  </label>

  <label>
    Your email
    <input type="email" name="_replyto" required>
  </label>

  <label>
    Subject
    <input type="text" name="_subject">
  </label>

  <label>
    Your message
    <textarea name="message" rows="8" required></textarea>
  </label>

  <button type="submit" class="btn">send</button>
</form>
