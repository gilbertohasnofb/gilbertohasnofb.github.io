# ------------------------------------------------------------------
# Site settings
# ------------------------------------------------------------------
title: "Gilberto Agostinho"
tagline: "composer"
description: "Portfolio site of Gilberto Agostinho, composer."

# IMPORTANT: for a user/org page (yourusername.github.io), url must be
# the root domain and baseurl must be left EMPTY (do not delete it).
url: "https://yourusername.github.io"
baseurl: ""

# ------------------------------------------------------------------
# Navigation (order matters — this is the order tabs appear)
# ------------------------------------------------------------------
nav:
  - title: about
    url: /about/
  - title: compositions
    url: /compositions/
  - title: concerts
    url: /concerts/
  - title: software
    url: /software/
  - title: writing
    url: /writing/
  - title: photography
    url: /photography/
  - title: contact
    url: /contact/

# ------------------------------------------------------------------
# Collections
# ------------------------------------------------------------------
collections:
  compositions:
    output: false  # entries have no individual pages — they're
                   # rendered inline as a list on /compositions/
                   # (sorted by year via Liquid in the layout)
  photography:
    output: false  # entries render as cards on /photography/,
                   # in the order the files are listed (no
                   # automatic sorting — order your files as
                   # 01-, 02-, etc. or however you like)
  concerts:
    output: false  # entries render as a list on /concerts/,
                   # sorted by date (newest first) via Liquid
  software:
    output: false  # entries render as a list on /software/,
                   # in the order the files are listed (no
                   # automatic sorting — order your files as
                   # 01-, 02-, etc. or however you like)
  writing:
    output: false  # entries render as a list on /writing/,
                   # sorted by year (newest first) via Liquid

# ------------------------------------------------------------------
# Build settings
# ------------------------------------------------------------------
markdown: kramdown
sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
